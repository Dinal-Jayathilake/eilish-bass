org: dinalj

app: eilish

service: eilish-bass

package:
  patterns:
    - "!**"
    - "app/**"
    - "!**/__pycache__/**"

provider:
  name: aws
  runtime: python3.13
  stage: ${opt:stage, 'dev'}
  region: ${self:custom.regions.${self:provider.stage}}
  websocketsApiName: ${self:service}-${sls:stage}-websockets
  environment:
    WEBSOCKET_CONNECTIONS_TABLE: !Ref websocketConnectionsTable
    WEBSOCKET_API_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
  logRetentionInDays: 1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:DeleteItem
        - dynamodb:Scan
        - dynamodb:Query
      Resource:
        - !GetAtt websocketConnectionsTable.Arn
        - !Sub "${websocketConnectionsTable.Arn}/index/*"
    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/*/*"

functions:
  coreHandlerLambda:
    handler: app.functions.core.handler.lambda_handler
    name: ${self:service}-${sls:stage}-core-handler
    layers:
      - Ref: PythonRequirementsLambdaLayer

  websocketConnectionHandlerLambda:
    handler: app.functions.websocket.connection.handler.lambda_handler
    name: ${self:service}-${sls:stage}-websocket-connection-handler
    events:
      - websocket:
          route: $connect
      - websocket:
          route: $disconnect
    layers:
      - Ref: PythonRequirementsLambdaLayer

  websocketMessageHandlerLambda:
    handler: app.functions.websocket.message.handler.lambda_handler
    name: ${self:service}-${sls:stage}-websocket-message-handler
    events:
      - websocket: $default
      - websocket:
          route: sendMessage
      - websocket:
          route: broadcast
    layers:
      - Ref: PythonRequirementsLambdaLayer

resources:
  Resources:
    websocketConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-websocket-connections
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: N
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TimestampIndex
            KeySchema:
              - AttributeName: timestamp
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    layer: true
  regions:
    dev: ap-south-1
